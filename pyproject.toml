[project]
name = "datastore-api"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=48.0.1",
    "fastapi>=0.137.2",
    "gunicorn>=26.0.0",
    "pyarrow==23.0.1",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest-cov>=6.2.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.19",
    "pytest-mock>=3.14.1",
    "pandas>=3.0.3",
    "pre-commit>=4.6.0",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = true
exclude-newer = "7 days"

[tool.ruff]
line-length = 80
target-version = "py313"
lint.select = [
    "F",   # Pyflakes errors (including unused imports, undefined names)
    "T",   # flake8-type-checking (imports used only for typing)
    "E",   # pycodestyle errors (style errors)
    "W",   # pycodestyle warnings
    "I",   # isort import ordering
    "ANN", # type annotation related rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]

[tool.setuptools.packages.find]
include = ["datastore_api"]
